{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white fw-bold">SmartGuard AI Configuration & Telegram Bot</div>
    <div class="card-body">
        <form method="POST">
            <h6 class="fw-bold text-primary mb-3">Telegram Notification Settings</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Telegram Bot Token (from @BotFather)</label>
                    <input type="password" name="telegram_bot_token" class="form-control" value="{{ settings.telegram_bot_token }}" placeholder="123456789:ABCdef...">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telegram Chat ID (from @userinfobot)</label>
                    <input type="text" name="telegram_chat_id" class="form-control" value="{{ settings.telegram_chat_id }}" placeholder="987654321">
                </div>
            </div>

            <h6 class="fw-bold text-primary mb-3">Detection & Behavioral Thresholds</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Loitering Time Threshold (seconds)</label>
                    <input type="number" step="1" min="3" name="loitering_threshold" class="form-control" value="{{ settings.loitering_threshold }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">YOLO Detection Confidence Threshold (0.10 - 0.90)</label>
                    <input type="number" step="0.05" min="0.10" max="0.90" name="detection_confidence" class="form-control" value="{{ settings.detection_confidence }}">
                </div>
            </div>

            <h6 class="fw-bold text-primary mb-3">Active Security Rules</h6>
            <div class="row g-2 mb-4">
                <div class="col-md-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="enable_unknown" id="swUnknown" {% if settings.enable_unknown == '1' %}checked{% endif %}>
                        <label class="form-check-label" for="swUnknown">Unknown Person Alerts</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="enable_loitering" id="swLoiter" {% if settings.enable_loitering == '1' %}checked{% endif %}>
                        <label class="form-check-label" for="swLoiter">Loitering Detection</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="enable_package" id="swPackage" {% if settings.enable_package == '1' %}checked{% endif %}>
                        <label class="form-check-label" for="swPackage">Package / Bag Monitoring</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="enable_vehicle" id="swVehicle" {% if settings.enable_vehicle == '1' %}checked{% endif %}>
                        <label class="form-check-label" for="swVehicle">Vehicle Entry Alerts</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" name="action" value="save" class="btn btn-primary">Save Settings</button>
                <button type="submit" name="action" value="test_telegram" class="btn btn-outline-success">Save & Send Test Telegram Alert</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
